<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16212B">
<meta name="apple-mobile-web-app-title" content="Clean Streak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Clean Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: eine ruhige Spalte – Einrichtungs-Assistent oder Fortschritt (Zähler, Bilanz, Meilensteine, Verlauf) */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#16212B; --muted:#5C6B78; --line:#D5DDE3;
  --accent:#2D6A86; --accent-ink:#FFFFFF; --gold:#A87A1E; --gold-soft:#F4E7C8; --danger:#B0413E; --ok:#2F7D5B;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#18222B; --fg:#E6EDF2; --muted:#93A3B0; --line:#2A3743;
  --accent:#6FB3D2; --accent-ink:#0F161C; --gold:#E0B75A; --gold-soft:#3A3020; --danger:#E07A72; --ok:#6CC59A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222B; --fg:#E6EDF2; --muted:#93A3B0; --line:#2A3743;
  --accent:#6FB3D2; --accent-ink:#0F161C; --gold:#E0B75A; --gold-soft:#3A3020; --danger:#E07A72; --ok:#6CC59A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 10px;text-wrap:balance}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.col{display:flex;flex-direction:column;gap:20px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero-name{font-family:var(--f-display);font-size:1.25rem;font-weight:700;margin:0}
.why{color:var(--muted);margin:2px 0 0;font-style:italic}
.counter{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.days{font-family:var(--f-display);font-weight:700;font-size:clamp(4rem,18vw,6.5rem);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.days-unit{font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>*{flex:1 1 180px}
.done{background:transparent;color:var(--ok);border-color:var(--ok);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:.75rem}
.stat.big b{color:var(--ok)}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,1fr)}}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.coin{aspect-ratio:1;max-width:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--muted);font-size:.7rem;text-align:center;line-height:1.1}
.coin b{font-family:var(--f-display);font-size:1.15rem;color:inherit}
.coin.got{border:2px solid var(--gold);background:var(--gold-soft);color:var(--gold)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .dur{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--danger);grid-row:span 2}
.hist .when{color:var(--muted);font-size:.85rem}
.hist .note{font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);margin:0}
.hint{font-size:.85rem;color:var(--muted);margin:0}
/* Assistent */
.wiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.wiz-head{padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.wiz-steps{display:flex;gap:4px}
.wiz-steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.wiz-steps i.on{background:var(--accent)}
.wiz-q{font-family:var(--f-display);font-size:1.35rem;font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
.wiz-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.wiz-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.wiz-foot .btn-primary{flex:1}
.search{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.cats{max-height:46vh;overflow-y:auto;margin:0 -20px;border-top:1px solid var(--line)}
.cat-h{position:sticky;top:0;background:var(--bg);padding:8px 20px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px 20px}
.opt[aria-pressed="true"]{color:var(--accent);font-weight:700}
.opt[aria-pressed="true"]::after{content:"✓"}
.opt.used{color:var(--muted)}
.opt.used::after{content:"bereits aktiv";font-size:.8rem}
.stepper{display:flex;gap:12px;align-items:center}
.stepper output{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.4rem;border:1px solid var(--line);border-radius:999px;padding:10px;font-variant-numeric:tabular-nums}
.stepper button{width:52px;height:52px;border-radius:50%;font-size:1.4rem;padding:0;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week button{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:12px 0;font-size:.8rem;color:var(--muted)}
.week button:last-child{border-right:0}
.week button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.preview{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.92rem}
.preview b{font-family:var(--f-mono)}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-align:left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:5}
footer{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" alt="" width="32" height="32" style="border-radius:8px">Clean Streak</h1>
    <button id="addBtn" class="btn-ghost">+ Gewohnheit</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Gewohnheiten"></nav>
  <main id="main"></main>
  <section class="card" id="backupCard">
    <h2>Backup</h2>
    <p class="hint">Daten liegen nur in diesem Browser. Kopiere das Backup regelmäßig irgendwohin, um Gerätewechsel oder gelöschte Browserdaten zu überstehen.</p>
    <div class="panel">
      <div class="field"><label class="lbl" for="backupText">Backup-Text</label><textarea id="backupText" spellcheck="false" placeholder="Hier erscheint dein Backup, oder füge eins zum Wiederherstellen ein"></textarea></div>
      <div class="row"><button id="exportBtn">Backup erzeugen &amp; kopieren</button><button id="importBtn">Backup einspielen</button></div>
    </div>
  </section>
  <footer>Open Source · keine Werbung, kein Abo, kein Server · eine einzige HTML-Datei</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const KEY="clean-streak-v1", DAY=864e5;
const MILESTONES=[1,3,7,14,30,60,90,180,365,730];
const CATALOG={
  "Alkohol":["Alkohol","Bier","Wein","Schnaps","Komasaufen"],
  "Nikotin & Tabak":["Zigaretten","Dampfen","Snus","Nikotinbeutel","Tabak"],
  "Cannabis":["Cannabis","THC-Vapes"],
  "Andere Substanzen":["Schlafmittel","Schmerzmittel","Nasenspray","Andere Substanz"],
  "Essen & Koffein":["Zucker","Süßigkeiten","Softdrinks","Energy-Drinks","Koffein","Fast Food","Junkfood","Snacken am Abend"],
  "Sexualverhalten":["Masturbation","Pornografie"],
  "Körperbezogen":["Nägelkauen","Skin-Picking","Haareziehen","Lippenbeißen","Wangenbeißen","Fingerknacken"],
  "Impulsives Verhalten":["Glücksspiel","Sportwetten","Online-Shopping","Kaufsucht"],
  "Soziales":["Fluchen","Lügen","Tratschen","Wut","Aufschieben"],
  "Technologie":["Doomscrolling","Soziale Medien","Instagram","TikTok","Kurzvideos","YouTube","Videospiele","Dating-Apps","Chatbots (KI)","Handy im Bett"]
};
const STEPS=["what","start","days","times","cost","why"];
let state=load(), ui={confirm:null, wiz:null};

function uid(){return Math.random().toString(36).slice(2,10)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.habits))return s}catch(e){}return{active:null,habits:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function cur(){return state.habits.find(h=>h.id===state.active)||state.habits[0]}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDur(ms){ms=Math.max(0,ms);const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5);return d>0?`${d} T ${h} h`:`${h} h ${Math.floor(ms%36e5/6e4)} min`}
function fmtDate(t){return new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fmtNum(n,d=0){return n.toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtMin(m){m=Math.round(m);if(m<60)return m+" min";const h=Math.floor(m/60);if(h<48)return h+" h "+(m%60?m%60+" min":"");return fmtNum(h/24,1)+" Tage"}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function localInput(t){const d=new Date(t-new Date(t).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)}
function rate(h){return (h.daysPerWeek??0)/7*(h.timesPerDay??0)} // Vorkommen pro Tag

/* ---------- Assistent ---------- */
function startWizard(){
  ui.wiz={step:0,q:"",what:"",custom:false,start:Date.now(),future:false,daysPerWeek:0,timesPerDay:0,minutes:"",cost:"",why:"",label:""};
  ui.confirm=null; render();
}
function wizValid(w){
  const s=STEPS[w.step];
  if(s==="what")return !!w.what.trim();
  if(s==="start")return !isNaN(w.start);
  return true;
}
function renderWizard(){
  const w=ui.wiz, s=STEPS[w.step], used=state.habits.map(h=>h.what);
  let q="",body="";
  if(s==="what"){
    q="Womit hörst du auf?";
    const f=w.q.trim().toLowerCase();
    let list="";
    for(const [cat,items] of Object.entries(CATALOG)){
      const m=items.filter(i=>!f||i.toLowerCase().includes(f)||cat.toLowerCase().includes(f));
      if(!m.length)continue;
      list+=`<div class="cat-h">${esc(cat)}</div>`+m.map(i=>{
        const u=used.includes(i);
        return `<button class="opt ${u?"used":""}" data-pick="${esc(i)}" aria-pressed="${w.what===i&&!w.custom}" ${u?"disabled":""}>${esc(i)}</button>`}).join("");
    }
    body=`<input class="search" id="wSearch" placeholder="Suchen" value="${esc(w.q)}" autocomplete="off" aria-label="Suchen">
      <div class="cats">${list||`<p class="hint" style="padding:12px 20px">Nichts gefunden. Leg es unten selbst an.</p>`}
        <div class="cat-h">Eigene</div>
        <div style="padding:12px 20px" class="field"><label class="lbl" for="wCustom">Eigene Gewohnheit hinzufügen</label>
          <input id="wCustom" placeholder="z. B. Nachts Kühlschrank" maxlength="40" value="${w.custom?esc(w.what):""}"></div>
      </div>`;
  }
  if(s==="start"){
    q=w.future?"Ab wann möchtest du tracken?":"Wann war das Startdatum deiner Abstinenz?";
    body=`<div class="field"><label class="lbl" for="wStart">${w.future?"Startzeitpunkt (Zukunft)":"Clean seit"}</label>
      <input id="wStart" type="datetime-local" value="${localInput(w.start)}"></div>
      <button class="linkish" data-act="togglefuture">${w.future?"Doch ab jetzt oder einem vergangenen Datum":"Tracke ab einem zukünftigen Datum"}</button>`;
  }
  if(s==="days"){
    q=`An wie vielen Tagen pro Woche hattest du mit „${esc(w.what)}" zu tun?`;
    body=`<p class="hint">Im Durchschnitt, bevor du mit dem Tracking begonnen hast.</p>
      <div class="stepper"><output>${w.daysPerWeek} ${w.daysPerWeek===1?"Tag":"Tage"}</output>
        <button data-act="dpw-" aria-label="weniger" ${w.daysPerWeek<=0?"disabled":""}>−</button><button data-act="dpw+" aria-label="mehr" ${w.daysPerWeek>=7?"disabled":""}>+</button></div>
      <div class="week">${["Mo","Di","Mi","Do","Fr","Sa","So"].map((d,i)=>`<button data-dpw="${i+1}" class="${i<w.daysPerWeek?"on":""}" aria-label="${i+1} Tage">${d}</button>`).join("")}</div>`;
  }
  if(s==="times"){
    q="Wie oft an diesen Tagen?";
    body=`<p class="hint">Im Durchschnitt pro Tag, an dem es vorkam.</p>
      <div class="stepper"><output>${w.timesPerDay} ${w.timesPerDay===1?"Mal":"Male"}</output>
        <button data-act="tpd-" aria-label="weniger" ${w.timesPerDay<=0?"disabled":""}>−</button><button data-act="tpd+" aria-label="mehr">+</button></div>
      ${w.daysPerWeek&&w.timesPerDay?`<div class="preview">Das sind etwa <b>${fmtNum(w.daysPerWeek*w.timesPerDay)}</b> Mal pro Woche, hochgerechnet <b>${fmtNum(w.daysPerWeek*w.timesPerDay*52)}</b> Mal im Jahr.</div>`:""}`;
  }
  if(s==="cost"){
    q="Was hat dich ein Mal gekostet?";
    body=`<p class="hint">Optional. Daraus rechnet die App aus, wie viel Zeit und Geld du zurückgewinnst.</p>
      <div class="row">
        <div class="field"><label class="lbl" for="wMin">Zeit pro Mal (Minuten)</label><input id="wMin" type="number" inputmode="decimal" min="0" step="1" value="${esc(w.minutes)}" placeholder="0"></div>
        <div class="field"><label class="lbl" for="wCost">Kosten pro Mal (€)</label><input id="wCost" type="number" inputmode="decimal" min="0" step="0.1" value="${esc(w.cost)}" placeholder="0"></div>
      </div>`;
  }
  if(s==="why"){
    q="Erinnere dich daran, warum du das tust";
    body=`<p class="hint">Du siehst es jeden Tag beim Öffnen. Beschreib ein Gefühl, positiv oder negativ, je nachdem was stärker ist.</p>
      <div class="field"><label class="lbl" for="wWhy">Dein Warum</label><textarea id="wWhy" maxlength="200">${esc(w.why)}</textarea></div>
      <div class="field"><label class="lbl" for="wLabel">Anzeigename (optional, für Diskretion)</label><input id="wLabel" maxlength="40" value="${esc(w.label)}" placeholder="${esc(w.what)}"></div>
      <p class="hint">Der Anzeigename erscheint überall statt „${esc(w.what)}", z. B. „Projekt X".</p>`;
  }
  const last=w.step===STEPS.length-1, skippable=["days","times","cost"].includes(s);
  return `<section class="wiz" aria-live="polite">
    <div class="wiz-head"><div class="wiz-steps">${STEPS.map((_,i)=>`<i class="${i<=w.step?"on":""}"></i>`).join("")}</div>
      <p class="wiz-q">${q}</p></div>
    <div class="wiz-body">${body}</div>
    <div class="wiz-foot">
      <button data-act="wback">${w.step===0?(state.habits.length?"Abbrechen":"Zurück"):"Zurück"}</button>
      <button class="btn-primary" data-act="wnext" ${wizValid(w)?"":"disabled"}>${last?"Fertig":skippable&&!(s==="cost"?(w.minutes||w.cost):(s==="days"?w.daysPerWeek:w.timesPerDay))?"Überspringen":"Weiter"}</button>
    </div></section>`;
}
function readWizInputs(){
  const w=ui.wiz;if(!w)return;
  const g=id=>document.getElementById(id);
  if(g("wCustom")&&g("wCustom").value.trim()){w.what=g("wCustom").value.trim();w.custom=true}
  if(g("wStart")){const t=new Date(g("wStart").value).getTime();if(!isNaN(t))w.start=t}
  if(g("wMin"))w.minutes=g("wMin").value;
  if(g("wCost"))w.cost=g("wCost").value;
  if(g("wWhy"))w.why=g("wWhy").value;
  if(g("wLabel"))w.label=g("wLabel").value;
}
function finishWizard(){
  const w=ui.wiz,id=uid();
  state.habits.push({id,what:w.what,name:(w.label.trim()||w.what),why:w.why.trim(),start:w.start,
    daysPerWeek:w.daysPerWeek,timesPerDay:w.timesPerDay,minutes:+w.minutes||0,cost:+w.cost||0,checkins:[],resets:[],best:0});
  state.active=id;ui.wiz=null;save();render();toast("Angelegt. Ein Tag nach dem anderen.");
}

/* ---------- Fortschritt ---------- */
function renderTabs(){
  const nav=document.getElementById("tabs");
  nav.innerHTML=state.habits.map(h=>`<button class="tab" role="tab" aria-selected="${h.id===cur()?.id}" data-id="${h.id}">${esc(h.name)}</button>`).join("");
  nav.hidden=state.habits.length<2||!!ui.wiz;
  document.getElementById("addBtn").hidden=!!ui.wiz||!state.habits.length;
  document.getElementById("backupCard").hidden=!!ui.wiz&&!state.habits.length;
}
function render(){
  renderTabs();
  const main=document.getElementById("main");
  if(!state.habits.length&&!ui.wiz){ui.wiz={step:0,q:"",what:"",custom:false,start:Date.now(),future:false,daysPerWeek:0,timesPerDay:0,minutes:"",cost:"",why:"",label:""};renderTabs()}
  if(ui.wiz){main.innerHTML=renderWizard();return}
  const h=cur(), now=Date.now(), ms=now-h.start, future=ms<0;
  const days=Math.max(0,Math.floor(ms/DAY)), best=Math.max(h.best||0,ms);
  const next=MILESTONES.find(m=>m>days), prev=[...MILESTONES].reverse().find(m=>m<=days)||0;
  const pct=future?0:next?Math.min(100,(ms/DAY-prev)/(next-prev)*100):100;
  const checked=h.checkins.includes(today()), c=ui.confirm;
  const avoided=Math.max(0,ms/DAY*rate(h));
  const cards=[];
  if(rate(h)>0)cards.push(`<div class="stat big"><span class="lbl">Vermieden</span><b>${fmtNum(Math.floor(avoided))} ×</b><small>≈ ${fmtNum(rate(h)*7,1)} pro Woche</small></div>`);
  if(rate(h)>0&&h.minutes>0)cards.push(`<div class="stat big"><span class="lbl">Zeit zurück</span><b>${fmtMin(avoided*h.minutes)}</b><small>${fmtNum(h.minutes)} min pro Mal</small></div>`);
  if(rate(h)>0&&h.cost>0)cards.push(`<div class="stat big"><span class="lbl">Gespart</span><b>${fmtNum(avoided*h.cost,2)} €</b><small>${fmtNum(h.cost,2)} € pro Mal</small></div>`);
  cards.push(`<div class="stat"><span class="lbl">Rekord</span><b>${Math.floor(best/DAY)} T</b><small>längste Serie</small></div>`);
  cards.push(`<div class="stat"><span class="lbl">Check-ins</span><b>${h.checkins.length}</b><small>bestätigte Tage</small></div>`);
  cards.push(`<div class="stat"><span class="lbl">Neustarts</span><b>${h.resets.length}</b><small>gesamt</small></div>`);
  const yearProj=rate(h)>0?`<p class="hint">Hochgerechnet auf ein Jahr: ${fmtNum(rate(h)*365)} Mal${h.minutes?`, ${fmtMin(rate(h)*365*h.minutes)}`:""}${h.cost?`, ${fmtNum(rate(h)*365*h.cost,0)} €`:""}.</p>`:"";

  main.innerHTML=`<div class="col">
  <section class="hero">
    <div class="hero-top">
      <div><p class="hero-name">${esc(h.name)}</p>${h.why?`<p class="why">${esc(h.why)}</p>`:""}</div>
      <button class="btn-ghost" data-act="edit">Bearbeiten</button>
    </div>
    ${future?`<div><div class="lbl">Start in</div><div class="days" style="font-size:clamp(2.6rem,12vw,4rem)" id="days">${fmtDur(-ms)}</div><div class="clock" id="clock"></div></div>`:`
    <div><div class="counter"><span class="days" id="days">${days}</span><span class="days-unit">${days===1?"Tag":"Tage"}</span></div><div class="clock" id="clock"></div></div>
    <div class="progress"><div class="lbl">${next?`Nächster Meilenstein: ${next} ${next===1?"Tag":"Tage"} · noch ${fmtDur(next*DAY-ms)}`:"Alle Meilensteine erreicht"}</div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>
    <div class="actions">
      ${checked?`<button class="done" disabled>✓ Heute bestätigt</button>`:`<button class="btn-primary" data-act="checkin">Heute bleibe ich dabei</button>`}
      <button class="btn-danger" data-act="relapse">Rückfall eintragen</button>
    </div>`}
    ${c==="relapse"?`<form class="panel" id="relapseForm">
      <div class="field"><label class="lbl" for="rNote">Auslöser (optional), hilft dir, Muster zu erkennen</label><input id="rNote" maxlength="140" placeholder="z. B. Langeweile, Stress, spät abends"></div>
      <p class="hint">Deine Serie von ${fmtDur(ms)} wird gespeichert, der Zähler startet neu. Ein Rückfall löscht nicht, was du geschafft hast.</p>
      <div class="row"><button type="submit" class="btn-danger">Neu starten</button><button type="button" data-act="cancel">Abbrechen</button></div></form>`:""}
    ${c==="edit"?`<form class="panel" id="editForm">
      <div class="field"><label class="lbl" for="eName">Anzeigename</label><input id="eName" value="${esc(h.name)}" maxlength="40" required></div>
      <div class="field"><label class="lbl" for="eWhy">Warum?</label><textarea id="eWhy" maxlength="200">${esc(h.why)}</textarea></div>
      <div class="field"><label class="lbl" for="eStart">Startzeitpunkt</label><input id="eStart" type="datetime-local" value="${localInput(h.start)}" required></div>
      <div class="row">
        <div class="field"><label class="lbl" for="eDpw">Tage / Woche</label><input id="eDpw" type="number" min="0" max="7" value="${h.daysPerWeek||0}"></div>
        <div class="field"><label class="lbl" for="eTpd">Male / Tag</label><input id="eTpd" type="number" min="0" value="${h.timesPerDay||0}"></div>
      </div>
      <div class="row">
        <div class="field"><label class="lbl" for="eMin">Minuten / Mal</label><input id="eMin" type="number" min="0" value="${h.minutes||0}"></div>
        <div class="field"><label class="lbl" for="eCost">€ / Mal</label><input id="eCost" type="number" min="0" step="0.1" value="${h.cost||0}"></div>
      </div>
      <div class="row"><button type="submit" class="btn-primary">Speichern</button><button type="button" data-act="cancel">Abbrechen</button></div>
      <div class="row"><button type="button" class="btn-danger" data-act="askdelete">Gewohnheit löschen</button></div></form>`:""}
    ${c==="delete"?`<div class="panel"><p class="hint">„${esc(h.name)}" mit gesamtem Verlauf endgültig löschen?</p>
      <div class="row"><button class="btn-danger" data-act="delete">Endgültig löschen</button><button data-act="cancel">Abbrechen</button></div></div>`:""}
  </section>
  <section class="col" style="gap:8px"><div class="stats">${cards.join("")}</div>${yearProj}</section>
  <section class="card"><h2>Meilensteine</h2>
    <div class="coins">${MILESTONES.map(m=>`<div class="coin ${days>=m&&!future?"got":""}" title="${m} Tage"><b>${m>=365?(m/365)+"J":m}</b>${m>=365?(m===365?"Jahr":"Jahre"):(m===1?"Tag":"Tage")}</div>`).join("")}</div></section>
  <section class="card"><h2>Verlauf</h2>
    ${h.resets.length?`<ul class="hist">${[...h.resets].reverse().map(r=>`<li><span class="dur">${fmtDur(r.ms)}</span><span class="when">${fmtDate(r.at+r.ms)}</span><span class="note">${r.note?esc(r.note):"<span class='hint'>kein Auslöser notiert</span>"}</span></li>`).join("")}</ul>`:`<p class="empty">Noch kein Rückfall. Weiter so.</p>`}
  </section></div>`;
  tick();
  const f=document.getElementById("rNote");if(f)f.focus();
}
function tick(){
  if(ui.wiz)return;const h=cur();if(!h)return;
  const clock=document.getElementById("clock");if(!clock)return;
  const ms=Date.now()-h.start;
  if(ms<0){clock.textContent="ab "+fmtDate(h.start);if(-ms<1000)render();return}
  const hh=Math.floor(ms%DAY/36e5),mm=Math.floor(ms%36e5/6e4),ss=Math.floor(ms%6e4/1e3);
  clock.textContent=`+ ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")} · seit ${fmtDate(h.start)}`;
  const el=document.getElementById("days");
  if(el&&+el.textContent!==Math.floor(ms/DAY))render();
}
setInterval(tick,1000);

/* ---------- Events ---------- */
document.addEventListener("input",e=>{
  if(e.target.id==="wSearch"){ui.wiz.q=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById("wSearch");s.focus();s.setSelectionRange(pos,pos)}
  if(e.target.id==="wCustom"){const v=e.target.value.trim();ui.wiz.what=v;ui.wiz.custom=!!v;
    document.querySelectorAll(".opt[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed","false"));
    document.querySelector('[data-act="wnext"]').disabled=!v}
});
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab");
  if(tab){state.active=tab.dataset.id;ui.confirm=null;save();render();return}
  const pick=e.target.closest("[data-pick]");
  if(pick){ui.wiz.what=pick.dataset.pick;ui.wiz.custom=false;render();return}
  const dpw=e.target.closest("[data-dpw]");
  if(dpw){ui.wiz.daysPerWeek=+dpw.dataset.dpw===ui.wiz.daysPerWeek?0:+dpw.dataset.dpw;render();return}
  const a=e.target.closest("[data-act]")?.dataset.act;if(!a)return;
  const w=ui.wiz;
  if(w){
    readWizInputs();
    if(a==="wnext"){if(!wizValid(w))return;if(STEPS[w.step]==="start"&&!w.future&&w.start>Date.now())w.start=Date.now();
      if(w.step===STEPS.length-1)return finishWizard();w.step++;render()}
    if(a==="wback"){if(w.step===0){if(state.habits.length){ui.wiz=null;render()}}else{w.step--;render()}}
    if(a==="togglefuture"){w.future=!w.future;w.start=w.future?Date.now()+DAY:Date.now();render()}
    if(a==="dpw-")w.daysPerWeek=Math.max(0,w.daysPerWeek-1),render();
    if(a==="dpw+")w.daysPerWeek=Math.min(7,w.daysPerWeek+1),render();
    if(a==="tpd-")w.timesPerDay=Math.max(0,w.timesPerDay-1),render();
    if(a==="tpd+")w.timesPerDay=Math.min(99,w.timesPerDay+1),render();
    return;
  }
  const h=cur();
  if(a==="checkin"){h.checkins.push(today());save();render();toast("Bestätigt. Ein Tag nach dem anderen.")}
  if(a==="relapse"){ui.confirm=ui.confirm==="relapse"?null:"relapse";render()}
  if(a==="edit"){ui.confirm=ui.confirm==="edit"?null:"edit";render()}
  if(a==="askdelete"){ui.confirm="delete";render()}
  if(a==="cancel"){ui.confirm=null;render()}
  if(a==="delete"){state.habits=state.habits.filter(x=>x.id!==h.id);state.active=state.habits[0]?.id;ui.confirm=null;save();render();toast("Gelöscht.")}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const h=cur();const g=id=>document.getElementById(id);
  if(e.target.id==="relapseForm"){
    const now=Date.now(),ms=now-h.start;
    h.resets.push({at:h.start,ms,note:g("rNote").value.trim()});
    h.best=Math.max(h.best||0,ms);h.start=now;ui.confirm=null;save();render();toast("Neu gestartet. Dein Rekord bleibt.");
  }
  if(e.target.id==="editForm"){
    h.name=g("eName").value.trim()||h.name;h.why=g("eWhy").value.trim();
    const t=new Date(g("eStart").value).getTime();if(!isNaN(t))h.start=t;
    h.daysPerWeek=Math.min(7,Math.max(0,+g("eDpw").value||0));h.timesPerDay=Math.max(0,+g("eTpd").value||0);
    h.minutes=Math.max(0,+g("eMin").value||0);h.cost=Math.max(0,+g("eCost").value||0);
    ui.confirm=null;save();render();toast("Gespeichert.");
  }
});
document.getElementById("addBtn").onclick=startWizard;
document.getElementById("exportBtn").onclick=()=>{
  const ta=document.getElementById("backupText");
  ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const fb=()=>{ta.select();toast("Text markiert, bitte selbst kopieren.")};
  try{navigator.clipboard.writeText(ta.value).then(()=>toast("Backup kopiert."),fb)}catch(err){fb()}
};
document.getElementById("importBtn").onclick=()=>{
  const raw=document.getElementById("backupText").value.trim();
  try{const s=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!Array.isArray(s.habits))throw 0;
    s.habits.forEach(h=>{h.what??=h.name;h.daysPerWeek??=0;h.timesPerDay??=0;h.minutes??=0;h.cost??=0;h.checkins??=[];h.resets??=[]});
    state=s;ui.wiz=null;ui.confirm=null;save();render();toast("Backup eingespielt.")}
  catch(err){toast("Backup ungültig. Bitte den kompletten Text einfügen.")}
};
// Altdaten aus Version 1 ergänzen
state.habits.forEach(h=>{h.what??=h.name;h.daysPerWeek??=0;h.timesPerDay??=0;h.minutes??=0;h.cost??=0});
render();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
